version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pcf_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pcf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/pcf_analytics_view.sql:/docker-entrypoint-initdb.d/01_pcf_analytics_view.sql

  minio:
    image: minio/minio
    container_name: pcf_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_LOGIN_ANIMATION: "off"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Nginx Reverse Proxy to allow embedding MinIO Console in React <iframe>
  minio-iframe-proxy:
    image: nginx:alpine
    container_name: pcf_minio_proxy
    restart: always
    ports:
      - "9002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: pcf_superset
    restart: always
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "bot_derp_secure_superset_key_2026"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:postgres@postgres:5432/pcf_db"
    depends_on:
      - postgres

  # OpenLineage Backend Metadata Database
  marquez-db:
    image: postgres:14
    container_name: pcf_marquez_db
    restart: always
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez_db_data:/var/lib/postgresql/data

  # OpenLineage API Server
  marquez:
    image: marquezproject/marquez:latest
    container_name: pcf_marquez
    restart: always
    ports:
      - "5000:5000" # OpenLineage HTTP API Endpoint
    environment:
      - POSTGRES_HOST=marquez-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_DB=marquez
    depends_on:
      - marquez-db

  # OpenLineage Web UI Interface
  marquez-web:
    image: marquezproject/marquez-web:latest
    container_name: pcf_marquez_web
    restart: always
    ports:
      - "3000:3000" # Marquez Frontend UI
    environment:
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
      - WEB_PORT=3000
    depends_on:
      - marquez

volumes:
  postgres_data:
  minio_data:
  marquez_db_data: